name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_run:
    workflows: ["Scrape Cineplex showtimes"]
    branches: [master]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Earlier attempts can leave artifacts attached to the same workflow run.
    env:
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Deployment and scraping consume the same validated snapshot.
      - name: Add showtime data
        # Allows the first deployment before the first migrated scrape.
        run: node scripts/data-snapshot.mjs restore 2a24e4c840198a78cc4ee7c741ce947c7a775c8c

      - name: Inject Clarity snippet
        env:
          CLARITY_PROJECT_ID: ${{ secrets.CLARITY_PROJECT_ID }}
        run: |
          snippet=$(cat <<EOF
          <script type="text/javascript">
              (function(c,l,a,r,i,t,y){
                  c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
                  t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
                  y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
              })(window, document, "clarity", "script", "$CLARITY_PROJECT_ID");
          </script>
          EOF
          )
          python3 - "$snippet" <<'PY'
          import sys, pathlib
          snippet = sys.argv[1]
          path = pathlib.Path("index.html")
          path.write_text(path.read_text().replace("<!--CLARITY_SNIPPET-->", snippet))
          PY

      # Per-theatre pages, footer directory and sitemap.xml for search engines.
      - name: Build site
        run: node scripts/build-site.mjs _site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        id: upload
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: _site

      # GitHub's artifact listing can lag behind a successful upload.
      - name: Wait for Pages artifact
        shell: bash
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          : "${ARTIFACT_ID:?Pages upload did not return an artifact ID}"
          endpoint="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$PAGES_ARTIFACT_NAME"
          for attempt in {1..12}; do
            sleep 5
            if visible_id=$(gh api "$endpoint" --jq '.artifacts[] | select(.expired == false) | .id') &&
              [[ "$visible_id" == "$ARTIFACT_ID" ]]; then
              echo "Pages artifact $ARTIFACT_ID is available."
              exit 0
            fi
            echo "Waiting for Pages artifact $ARTIFACT_ID (check $attempt of 12)."
          done
          echo "::error::Pages artifact $ARTIFACT_ID did not appear in the artifact list."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
