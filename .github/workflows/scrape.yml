name: Scrape Cineplex showtimes

on:
  schedule:
    # Times below are UTC-4 (EDT); each drifts back ~1hr during EST (UTC-5).
    # The deep window (IMAX advance-sale dates, up to 180 days out) is
    # expensive and doesn't need to run every time, so only the Thursday
    # 1pm entry runs it; every other entry runs the near window only.
    - cron: "0 12 * * *" # ~8am ET, every day: quick
    - cron: "0 17 * * 1,2,3,5,6,0" # ~1pm ET, every day except Thursday: quick
    - cron: "0 17 * * 4" # ~1pm ET Thursday: deep
    - cron: "0 18 * * *" # ~2pm ET, every day: quick
    - cron: "0 19 * * *" # ~3pm ET, every day: quick
    - cron: "0 20 * * *" # ~4pm ET, every day: quick
    - cron: "0 21 * * *" # ~5pm ET, every day: quick
    - cron: "0 22 * * *" # ~6pm ET, every day: quick
    - cron: "0 23 * * *" # ~7pm ET, every day: quick
    - cron: "0 0 * * *" # ~8pm ET, every day: quick
    - cron: "0 1 * * *" # ~9pm ET, every day: quick
    - cron: "0 2 * * *" # ~10pm ET, every day: quick
    - cron: "0 5 * * *" # ~1am ET, every day: quick
  workflow_dispatch:
    inputs:
      mode:
        description: "Scrape mode"
        type: choice
        options: [quick, deep]
        default: quick

permissions:
  contents: write

# A full scrape can run well over an hour at 152-theatre scale. Without
# this, an overlapping cron/manual trigger would run a second scrape
# concurrently and race with the first on the git commit/push at the end.
concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      # Ref (not the default github.sha) so a run that queues behind the
      # `scrape` concurrency group checks out whatever landed while it
      # waited, rather than the stale commit that was HEAD when it was
      # triggered — otherwise its own commit rebases against unrelated
      # concurrent changes and can conflict.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      # Per-theatre showtime data lives on the `data` branch, not master.
      # Nearly every theatre's file changes on every run (seat availability
      # is always moving), so committing it to master grew the repo's history
      # by ~10 MB/day. The `data` branch instead holds a single commit that
      # each run replaces, so old snapshots become unreachable and the branch
      # stays the size of one snapshot.
      #
      # Overlay the last published snapshot onto the checkout before
      # scraping: quick mode's carry-forward of far-future days and the
      # fail-soft "leave the last good file untouched" behavior both depend
      # on the previous files being in data/. If the data branch doesn't
      # exist yet, the checkout's own data/ files are used as-is.
      - name: Restore previous data
        id: restore
        run: |
          if git fetch --depth=1 origin data; then
            git archive FETCH_HEAD data | tar -x
            echo "sha=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No data branch yet; starting from the checkout's data/ files"
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Determine scrape mode
        id: mode
        run: |
          if [ "${{ github.event.schedule }}" = "0 17 * * 4" ]; then
            mode=deep
          elif [ -n "${{ github.event.schedule }}" ]; then
            mode=quick
          else
            mode="${{ inputs.mode }}"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Run scraper
        env:
          SCRAPE_MODE: ${{ steps.mode.outputs.mode }}
          CINEPLEX_SUBSCRIPTION_KEY: ${{ secrets.CINEPLEX_SUBSCRIPTION_KEY }}
        run: node scripts/scrape.mjs

      # Replaces the data branch with a single parentless commit holding this
      # run's snapshot (built in a scratch index so the master checkout is
      # left alone). theatres.json stays on master, since it's the manifest
      # a human regenerates and commits. The lease makes the force-push fail
      # rather than clobber anything that changed on the branch since the
      # restore step read it.
      - name: Publish data branch
        env:
          PREVIOUS: ${{ steps.restore.outputs.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          export GIT_INDEX_FILE="$RUNNER_TEMP/data-index"
          rm -f "$GIT_INDEX_FILE"
          git add -f -- 'data/*.json' ':(exclude)data/theatres.json'
          tree=$(git write-tree)
          if [ -n "$PREVIOUS" ] && [ "$tree" = "$(git rev-parse "$PREVIOUS^{tree}")" ]; then
            echo "No data changes"
            exit 0
          fi
          commit=$(git commit-tree "$tree" -m "Update showtimes")
          git push --force-with-lease="refs/heads/data:$PREVIOUS" origin "$commit:refs/heads/data"
